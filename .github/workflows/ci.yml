name: CI

# Typecheck + test on every push and pull request. Tests run against
# the static seed repository (no DATABASE_URL in CI), which is exactly
# the zero-config path a fresh clone exercises. The repository contract
# suite additionally runs against Postgres when TEST_DATABASE_URL is
# provided — not wired up in CI yet.

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # postinstall runs `prisma generate`, which the typecheck needs
      # for lib/generated/prisma.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
