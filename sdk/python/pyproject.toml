[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pharmacopeia"
version = "0.1.0"
description = "Thin, fully-typed Python client for the pharmacopeia API. Models are generated from the same Zod schemas the API uses."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
]
keywords = ["pharmacopeia", "drugs", "api", "client", "sdk"]

[tool.hatch.build.targets.wheel]
packages = ["pharmacopeia"]
